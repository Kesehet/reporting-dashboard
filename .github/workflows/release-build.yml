name: Release build quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regressions:
    name: Python imports, data regressions and chart contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      TZ: UTC
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install full production Python requirements and freezer
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r tests/contracts/requirements.txt
          python -m pip install 'pyinstaller>=6.10,<7'
      - name: Verify pinned distributions, syntax and every backend import
        run: python api-server/build/generate_build.py --check-only --skip-install
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend parser used by the chart-contract auditor
        run: npm ci --no-audit --no-fund
      - name: Generate complete synthetic chart inventory and compare baselines
        run: python scripts/run_chart_contracts.py
      - name: Run full backend regression suite
        run: python -m pytest -q tests
      - name: Upload chart contract diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-chart-regression-results
          path: contract-results/
          retention-days: 7
          if-no-files-found: ignore

  frontend-visual:
    name: Full React tests and actual-browser visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore lockfile-pinned frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install synthetic chart-contract generator dependencies
        run: python -m pip install -r tests/contracts/requirements.txt
      - name: Generate chart response fixtures consumed by React tests
        run: python scripts/run_chart_contracts.py
      - name: Run full React component and service tests
        run: npm run test:nocov -- --runInBand
      - name: Build production React assets
        run: CI=false npm run build
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1 --no-audit --no-fund
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify rendered card geometry, mobile/desktop layout and interactive tabs
        run: npx playwright test -c browser-tests/playwright.config.cjs --reporter=line,html
      - name: Upload synthetic screenshots and traces even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-visual-evidence
          path: |
            browser-tests/screenshots/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  windows-frozen-executables:
    name: Windows executable packaging and import smoke
    needs: [backend-regressions, frontend-visual]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore pinned Python requirements and PyInstaller
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Verify runtime dependencies and Python import graph on Windows
        run: python api-server/build/generate_build.py --check-only --skip-install
      - name: Freeze serve, cache_gen and csvLoader; execute smoke checks in each real EXE
        run: python api-server/build/generate_build.py --skip-install
      - name: Publish verified release executables and manifest
        uses: actions/upload-artifact@v4
        with:
          name: reporting-dashboard-windows-executables
          path: |
            exe_dist/*.exe
            exe_dist/build-report.json
          retention-days: 7
          if-no-files-found: error

name: OPPIQ report regressions
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run OPPIQ backend tests
        run: python -m unittest discover -s tests -p 'test_oppiq_report.py' -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run OPPIQ UI tests
        run: npm run test:nocov -- --runInBand --runTestsByPath src/__test__/Components/OppiqReportTab.test.js

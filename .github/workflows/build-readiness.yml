name: Build readiness and Windows packaging
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Python + UI regression gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller -r tests/contracts/requirements.txt
          npm ci --no-audit --no-fund
      - name: Verify dependencies, imports and parseable source
        run: python api-server/build/generate_build.py --check
      - name: Full backend regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate verified chart response fixtures
        run: python scripts/run_chart_contracts.py
      - name: UI regression suite
        run: npm run test:nocov -- --runInBand
      - name: Compile production frontend (retain existing lint warnings)
        env:
          CI: 'false'
        run: npm run build
      - name: Human-readable check summary
        if: always()
        run: |
          echo '## Build readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dependency health, Python parsing, backend tests, React tests, and production frontend compilation must all pass before Windows packaging.' >> "$GITHUB_STEP_SUMMARY"

  windows-package:
    name: Windows PyInstaller executables
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exactly declared requirements
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip check
      - name: Validate Python source and dependencies
        run: python api-server/build/generate_build.py --check
      - name: Build every Windows executable
        run: python api-server/build/generate_build.py
      - name: Verify all nine deliverables are nonempty
        shell: pwsh
        run: |
          $missing = @()
          foreach ($envName in @('qa','prod','dev')) {
            foreach ($entry in @('serve','cache_gen','csvLoader')) {
              $file = "exe_dist/${envName}_${entry}.exe"
              if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) { $missing += $file }
            }
          }
          if ($missing.Count -gt 0) { throw "Missing or empty executables: $($missing -join ', ')" }
          "## Windows packaging" >> $env:GITHUB_STEP_SUMMARY
          "All 9 Windows executables were generated and checked for nonzero size." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload executables and diagnostic warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            exe_dist/*.exe
            exe_build/**/warn-*.txt
          retention-days: 7
          if-no-files-found: warn

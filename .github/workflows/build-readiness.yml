name: Build readiness and Windows packaging
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    name: Windows PyInstaller executables
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create isolated packaging environment
        shell: pwsh
        run: python -m venv .build-venv
      - name: Install exactly declared requirements
        shell: pwsh
        run: |
          .\\.build-venv\\Scripts\\python.exe -m pip install -r requirements.txt
          .\\.build-venv\\Scripts\\python.exe -m pip install pyinstaller
          .\\.build-venv\\Scripts\\python.exe -m pip check
      - name: Validate Python source and dependencies
        shell: pwsh
        run: .\\.build-venv\\Scripts\\python.exe api-server/build/generate_build.py --check
      - name: Build every Windows executable
        shell: pwsh
        run: .\\.build-venv\\Scripts\\python.exe api-server/build/generate_build.py
      - name: Verify all nine deliverables are nonempty
        shell: pwsh
        run: |
          $missing = @()
          foreach ($envName in @('qa','prod','dev')) {
            foreach ($entry in @('serve','cache_gen','csvLoader')) {
              $file = "exe_dist/${envName}_${entry}.exe"
              if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) { $missing += $file }
            }
          }
          if ($missing.Count -gt 0) { throw "Missing or empty executables: $($missing -join ', ')" }
          "## Windows packaging" >> $env:GITHUB_STEP_SUMMARY
          "All 9 Windows executables were generated and checked for nonzero size." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload executables and diagnostic warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            exe_dist/*.exe
            exe_build/**/warn-*.txt
          retention-days: 7
          if-no-files-found: warn

  preflight:
    name: Complete Python + UI regression gates
    needs: windows-package
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller -r tests/contracts/requirements.txt
          npm ci --no-audit --no-fund
      - name: Build production frontend before running tests
        env:
          CI: 'false'
        run: npm run build
      - name: Upload frontend build regardless of later test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-frontend-build
          path: build/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify dependencies, imports and parseable source
        if: always()
        run: python api-server/build/generate_build.py --check
      - name: Generate real chart response fixtures (never skip in full suite)
        if: always()
        run: python scripts/run_chart_contracts.py
      - name: Full backend regression suite
        if: always()
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Chart HTTP and query contract regressions
        if: always()
        run: python -m unittest discover -s tests/contracts -p 'test_*.py' -v
      - name: Full UI suite with mandatory backend chart contracts
        if: always()
        env:
          CI: 'true'
          CHART_CONTRACTS_REQUIRED: '1'
        run: npm run test:nocov -- --runInBand
      - name: Human-readable check summary
        if: always()
        run: |
          echo '## Build-first readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows executables and frontend assets were built before validation. All regressions are mandatory; failed tests leave published build artifacts available and mark CI red.' >> "$GITHUB_STEP_SUMMARY"

  windows-backend-regressions:
    name: Windows backend regression tests
    needs: windows-package
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Run full backend regression suite natively on Windows
        run: python -m unittest discover -s tests -p 'test_*.py' -v


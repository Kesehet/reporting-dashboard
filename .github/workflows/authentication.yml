name: LDAP MSAL and API-key authentication tests

on:
  pull_request:
  push:
    branches: [main, restore-ldap-msal-chart-api-20261020]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.0.3 ldap3==2.9.1 PyJWT==2.8.0 cryptography==44.0.3
      - run: python -m unittest discover -s tests -p test_authentication.py -v
      - run: python -m py_compile api-server/authentication.py api-server/serve.py api-server/role_filter.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: CI=true npm run test:nocov -- --runInBand --testPathPattern='AuthorizationService.test.js|ReportLoginComponent.test.js|sessionHeaders.test.js'
      - run: CI=false npm run build

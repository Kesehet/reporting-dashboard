name: String decryption regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decryption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python test dependencies
        run: python -m pip install Flask==3.0.3 pycryptodome==3.20.0
      - name: AES-GCM and restricted API regression tests
        run: python -m unittest discover -s tests/decryption -p 'test_decryption.py' -v
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: UI, navigation, and HTTP contract tests
        run: npm run test:nocov -- --runInBand --testPathPattern=Decryption
      - name: Production frontend build
        run: CI=false npm run build
